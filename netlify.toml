[build]
  command = "node scripts/build-static.js"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  # DEEPSEEK_MODEL is just a model name (not a secret) and appears in docs/defaults, so skip it in the secrets scan.
  # DEEPSEEK_API_KEY is still scanned and must never appear in the repo.
  SECRETS_SCAN_OMIT_KEYS = "DEEPSEEK_MODEL"

[functions]
  node_bundler = "esbuild"

# Same security headers the Node server sends (the CSP matches the <meta> tag in index.html).
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cross-Origin-Opener-Policy = "same-origin"
